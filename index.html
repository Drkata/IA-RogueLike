<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Arcaniste des Profondeurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Grenze+Gotisch:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/ui/hud.css">
</head>

<body>
  <div id="app"></div>

  <!-- HUD, built by src/ui/HUDManager.js -->
  <div id="hud-container"></div>

  <div id="boss-health-container" class="boss" hidden>
    <p class="boss__name">Sentinelle colossale</p>
    <div class="boss__bar">
      <span id="boss-health-bar" class="boss__fill"></span>
      <span id="boss-health-text" class="boss__hp"></span>
    </div>
  </div>

  <div id="upgrade-menu" class="overlay overlay--grimoire" hidden>
    <div class="grimoire" role="dialog" aria-labelledby="upgrade-title">
      <header class="grimoire__head">
        <h2 id="upgrade-title" class="title">Niveau franchi</h2>
        <p id="upgrade-points" class="points" aria-live="polite"></p>
      </header>
      <div class="upgrade-grid"></div>
      <div class="grimoire__ledgers">
        <section class="ledger ledger--menu" aria-label="Votre arcaniste">
          <h3 class="ledger__title">Votre arcaniste</h3>
          <div id="upgrade-ledger-player" class="ledger__cols"></div>
        </section>
        <section id="upgrade-ledger-threat" class="ledger ledger--menu ledger--threat" aria-label="Prochain niveau"></section>
      </div>
    </div>
  </div>

  <div id="altar-menu" class="overlay overlay--altar" hidden>
    <div class="sanctum" role="dialog" aria-labelledby="altar-title">
      <h2 id="altar-title" class="title">Autel du Chaos</h2>
      <p class="lede">Scellez un pacte. Chaque don a son prix, et il est permanent.</p>
      <div class="pact-grid" id="altar-grid-container"></div>
      <button id="close-altar-btn" class="btn btn--quiet" type="button">Refuser et partir</button>
    </div>
  </div>

  <div id="shop-menu" class="overlay overlay--shop" hidden>
    <div class="stall" role="dialog" aria-labelledby="shop-title">
      <header class="stall__head">
        <h2 id="shop-title" class="title">Marchand mystique</h2>
        <p class="purse"><span id="shop-gold-value">0</span> pièces d'or</p>
      </header>
      <ul class="wares" id="shop-wares"></ul>
      <p id="shop-feedback" class="feedback" role="status"></p>
      <button id="close-shop-btn" class="btn btn--quiet" type="button">Quitter la boutique</button>
    </div>
  </div>

  <div id="game-over-screen" class="overlay overlay--death" hidden>
    <div class="epitaph" role="dialog" aria-label="Fin de partie"></div>
  </div>

  <div class="rotate-hint" role="status">
    <p class="title">Tournez votre téléphone</p>
    <p class="lede">Le jeu se joue à l'horizontale. Il reprend dès que l'écran est tourné.</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
